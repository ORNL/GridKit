name: REPCC
parameters:
  - name: tfltr
    symbol: T_{\mathrm{fltr}}
    description: Measurement transducer time constant
    unit: s
    typical_values: [0.02]
  - name: kp
    symbol: K_{\mathrm{p}}
    description: Proportional gain of reactive power controller
    unit: pu
    typical_values: []
  - name: ki
    symbol: K_{\mathrm{i}}
    description: Integral gain of reactive power controller
    unit: pu
    typical_values: []
  - name: tft
    symbol: T_{\mathrm{ft}}
    description: Lead time constant
    unit: s
    typical_values: [0.0]
  - name: tfv
    symbol: T_{\mathrm{fv}}
    description: Lag time constant
    unit: s
    typical_values: []
  - name: refflg
    symbol: R_{\mathrm{efflg}}
    description: 0 reactive power control, 1 voltage control, 2 power factor control (REPC_C only)
    unit: null
    typical_values: [1.0]
  - name: vfrz
    symbol: V_{\mathrm{frz}}
    description: Voltage below which controller states are frozen
    unit: pu
    typical_values: [0.7]
  - name: tfrz
    symbol: T_{\mathrm{frz}}
    description: Time delay during which states are kept frozen after voltage recovers above vfrz
    unit: s
    typical_values: [0.5]
  - name: rc
    symbol: R_{\mathrm{c}}
    description: Current compensation resistance
    unit: pu
    typical_values: []
  - name: xc
    symbol: X_{\mathrm{c}}
    description: Current compensation reactance
    unit: pu
    typical_values: []
  - name: kc
    symbol: K_{\mathrm{c}}
    description: Reactive droop gain
    unit: pu/pu
    typical_values: []
  - name: tc
    symbol: T_{\mathrm{c}}
    description: Time constant for reactive power measurement/filtering in the reactive droop function
    unit: s
    typical_values: [0.02]
  - name: vcmpflg
    symbol: V_{\mathrm{cmpflg}}
    description: 'Flag: 0 reactive droop, 1 current compensation'
    unit: null
    typical_values: [0.0]
  - name: emax
    symbol: E_{\mathrm{max}}
    description: Maximum error limit
    unit: pu
    typical_values: [999.0]
  - name: emin
    symbol: E_{\mathrm{min}}
    description: Minimum error limit
    unit: pu
    typical_values: [-999.0]
  - name: dbd
    symbol: D_{\mathrm{bd}}
    description: Deadband
    unit: pu
    typical_values: [0.0]
  - name: qvmax
    symbol: Q_{\mathrm{vmax}}
    description: Maximum limit of the reactive power (or voltage) for the PI controller
    unit: pu
    typical_values: []
  - name: qvmin
    symbol: Q_{\mathrm{vmin}}
    description: Minimum limit of the reactive power (or voltage) for the PI controller
    unit: pu
    typical_values: []
  - name: kpg
    symbol: K_{\mathrm{pg}}
    description: Proportional gain for active power control
    unit: pu/pu
    typical_values: []
  - name: kig
    symbol: K_{\mathrm{ig}}
    description: Integral gain for active power control
    unit: pu/pu/s
    typical_values: []
  - name: tp
    symbol: T_{\mathrm{p}}
    description: Lag time constant on electric power measurement
    unit: s
    typical_values: [0.02]
  - name: fdbd1
    symbol: F_{\mathrm{dbd1}}
    description: Deadband for primary frequency response for overfrequency events
    unit: pu
    typical_values: [-0.0006]
  - name: fdbd2
    symbol: F_{\mathrm{dbd2}}
    description: Deadband for primary frequency response for underfrequency events
    unit: pu
    typical_values: [0.0006]
  - name: femax
    symbol: F_{\mathrm{emax}}
    description: Maximum frequency error limit
    unit: pu
    typical_values: [999.0]
  - name: femin
    symbol: F_{\mathrm{emin}}
    description: Minimum frequency error limit
    unit: pu
    typical_values: [-999.0]
  - name: pimax
    symbol: P_{\mathrm{imax}}
    description: Maximum limit of the active power PI controller
    unit: pu
    typical_values: [1.0]
  - name: pimin
    symbol: P_{\mathrm{imin}}
    description: Minimum limit of the active power PI controller
    unit: pu
    typical_values: [0.0]
  - name: pmax
    symbol: P_{\mathrm{max}}
    description: Maximum active power limit
    unit: pu
    typical_values: [1.0]
  - name: pmin
    symbol: P_{\mathrm{min}}
    description: Minimum active power limit
    unit: pu
    typical_values: [0.0]
  - name: prmax
    symbol: P_{\mathrm{rmax}}
    description: Maximum rate of increase of Pref
    unit: pu/s
    typical_values: [999.0]
  - name: prmin
    symbol: P_{\mathrm{rmin}}
    description: Maximum rate of decrease of Pref
    unit: pu/s
    typical_values: [-999.0]
  - name: dprmax
    symbol: D_{\mathrm{prmax}}
    description: Maximum rate of increase of plant Pref
    unit: pu/s
    typical_values: [999.0]
  - name: dprmin
    symbol: D_{\mathrm{prmin}}
    description: Maximum rate of decrease of plant Pref
    unit: pu/s
    typical_values: [-999.0]
  - name: tlag
    symbol: T_{\mathrm{lag}}
    description: Lag time constant
    unit: s
    typical_values: []
  - name: ddn
    symbol: D_{\mathrm{dn}}
    description: Downside droop for PFR (overfrequency event, pushes power down)
    unit: pu/pu
    typical_values: [20.0]
  - name: dup
    symbol: D_{\mathrm{up}}
    description: Upside droop for PFR (underfrequency event, pushes power up)
    unit: pu/pu
    typical_values: [20.0]
  - name: frqflg
    symbol: F_{\mathrm{rqflg}}
    description: 'Flag: 1 turns on PFR functionality, 0 turns it off'
    unit: null
    typical_values: [1.0]
  - name: vrefmax
    symbol: V_{\mathrm{refmax}}
    description: Maximum limit on Vref
    unit: pu
    typical_values: [1.1]
  - name: vrefmin
    symbol: V_{\mathrm{refmin}}
    description: Minimum limit on Vref
    unit: pu
    typical_values: [0.9]
  - name: qrefmax
    symbol: Q_{\mathrm{refmax}}
    description: Maximum limit on Qref
    unit: pu
    typical_values: [999.0]
  - name: qrefmin
    symbol: Q_{\mathrm{refmin}}
    description: Minimum limit on Qref
    unit: pu
    typical_values: [-999.0]
  - name: dqrefmax
    symbol: D_{\mathrm{qrefmax}}
    description: Maximum rate of increase of Q reference
    unit: pu/s
    typical_values: [999.0]
  - name: dqrefmin
    symbol: D_{\mathrm{qrefmin}}
    description: Maximum rate of decrease of Q reference
    unit: pu/s
    typical_values: [-999.0]
  - name: qvrmax
    symbol: Q_{\mathrm{vrmax}}
    description: Maximum rate of increase of Qext
    unit: pu/s
    typical_values: [999.0]
  - name: qvrmin
    symbol: Q_{\mathrm{vrmin}}
    description: Maximum rate of decrease of Qext
    unit: pu/s
    typical_values: [-999.0]
  - name: pfmax
    symbol: P_{\mathrm{fmax}}
    description: Maximum limit on power factor
    unit: null
    typical_values: [0.95]
  - name: pfmin
    symbol: P_{\mathrm{fmin}}
    description: Minimum limit on power factor
    unit: null
    typical_values: [-0.95]
  - name: MSSflag
    symbol: M_{\mathrm{SSflag}}
    description: If 1 the mechanically switched shunt switching logic is activated
    unit: null
    typical_values: [0.0]
  - name: MSSbus1
    symbol: M_{\mathrm{SSbus1}}
    description: Bus defining the branch where Qbranch2 is measured for MSS switching
    unit: bus no.
    typical_values: []
  - name: MSSbus2
    symbol: M_{\mathrm{SSbus2}}
    description: Bus defining the branch where Qbranch2 is measured for MSS switching
    unit: bus no.
    typical_values: []
  - name: Qdn1
    symbol: Q_{\mathrm{dn1}}
    description: First stage of capacitor (reactor) switching out (in)
    unit: pu
    typical_values: []
  - name: Qdn2
    symbol: Q_{\mathrm{dn2}}
    description: Second stage of capacitor (reactor) switching out (in)
    unit: pu
    typical_values: []
  - name: Qup1
    symbol: Q_{\mathrm{up1}}
    description: First stage of capacitor (reactor) switching in (out)
    unit: pu
    typical_values: []
  - name: Qup2
    symbol: Q_{\mathrm{up2}}
    description: Second stage of capacitor (reactor) switching in (out)
    unit: pu
    typical_values: []
  - name: Tdelay1
    symbol: T_{\mathrm{delay1}}
    description: Time delay for first-stage shunt switching
    unit: s
    typical_values: []
  - name: Tdelay2
    symbol: T_{\mathrm{delay2}}
    description: Time delay for second-stage shunt switching; typically shorter than Tdelay1
    unit: s
    typical_values: []
  - name: Tmssbrk
    symbol: T_{\mathrm{mssbrk}}
    description: Time to switch a mechanically switched shunt in or out; the breaker delay
    unit: s
    typical_values: []
  - name: Tout
    symbol: T_{\mathrm{out}}
    description: Discharging time of a capacitor just switched out, before it can be switched back in
    unit: s
    typical_values: []
  - name: tfrq
    symbol: T_{\mathrm{frq}}
    description: Frequency transducer/filter time constant
    unit: s
    typical_values: [0.1]
  - name: Ffwrd_flag
    symbol: F_{\mathrm{fwrdflag}}
    description: Enable (1) or disable (0) the feedforward path
    unit: null
    typical_values: []
  - name: Pefd_flag
    symbol: P_{\mathrm{efdflag}}
    description: Enable (1) or disable (0) electrical power feedback
    unit: null
    typical_values: []
  - name: vfreq
    symbol: V_{\mathrm{freq}}
    description: If voltage at the frequency-monitored bus is below vfreq, measured frequency is set to
      1 pu
    unit: pu
    typical_values: [0.8]
  - name: QVflg
    symbol: Q_{\mathrm{Vflg}}
    description: 'Flag: 0 disables volt/var control completely, 1 enables it'
    unit: null
    typical_values: [1.0]
  - name: dfmax
    symbol: D_{\mathrm{fmax}}
    description: Maximum limit on frequency deviation
    unit: pu
    typical_values: [999.0]
  - name: dfmin
    symbol: D_{\mathrm{fmin}}
    description: Minimum limit on frequency deviation
    unit: pu
    typical_values: [-999.0]
  - name: fbus
    symbol: F_{\mathrm{bus}}
    description: Bus at which frequency is monitored; if zero the from-bus of the monitored branch is
      used
    unit: bus no.
    typical_values: []
  - name: FromBus
    symbol: F_{\mathrm{romBus}}
    description: From-bus of the monitored branch at the point of measurement
    unit: bus no.
    typical_values: []
  - name: ToBus
    symbol: T_{\mathrm{oBus}}
    description: To-bus of the monitored branch at the point of measurement
    unit: bus no.
    typical_values: []
  - name: BranchID
    symbol: B_{\mathrm{ranchID}}
    description: ID of the monitored branch at the point of measurement
    unit: ID
    typical_values: []
