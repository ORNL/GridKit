name: DC4C
parameters:
  - name: RC
    symbol: 'R_{\mathrm{C}}'
    description: Resistive component of load compensation
    unit: pu
    typical_values: [0]
  - name: XC
    symbol: 'X_{\mathrm{C}}'
    description: Reactance component of load compensation
    unit: pu
    typical_values: [0]
  - name: TR
    symbol: 'T_{\mathrm{R}}'
    description: Regulator input filter time constant
    unit: s
    typical_values: [0]
  - name: KPR
    symbol: 'K_{\mathrm{PR}}'
    description: Regulator proportional gain
    unit: pu
    typical_values: [80]
  - name: KIR
    symbol: 'K_{\mathrm{IR}}'
    description: Regulator integral gain
    unit: pu/s
    typical_values: [20]
  - name: KDR
    symbol: 'K_{\mathrm{DR}}'
    description: Regulator derivative gain
    unit: pu
    typical_values: [20]
  - name: TDR
    symbol: 'T_{\mathrm{DR}}'
    description: Regulator derivative filter time constant
    unit: s
    typical_values: [0.01]
  - name: KA
    symbol: 'K_{\mathrm{A}}'
    description: Regulator output gain
    unit: pu
    typical_values: [1]
  - name: TA
    symbol: 'T_{\mathrm{A}}'
    description: Regulator output time constant
    unit: s
    typical_values: [0.02]
  - name: VRmax
    symbol: 'V_{\mathrm{Rmax}}'
    description: Maximum controller output
    unit: pu
    typical_values: [2.7]
  - name: VRmin
    symbol: 'V_{\mathrm{Rmin}}'
    description: Minimum controller output
    unit: pu
    typical_values: [-2.7]
  - name: TE
    symbol: 'T_{\mathrm{E}}'
    description: Exciter field time constant
    unit: s
    typical_values: [0.8]
  - name: KE
    symbol: 'K_{\mathrm{E}}'
    description: Exciter field proportional constant
    unit: pu
    typical_values: [1.0]
  - name: VEmin
    symbol: 'V_{\mathrm{Emin}}'
    description: Exciter minimum output voltage
    unit: pu
    typical_values: [0]
  - name: E1
    symbol: 'E_{1}'
    description: Exciter output voltage for saturation factor S (E ) E 1
    unit: pu
    typical_values: [4.8]
  - name: SE1
    symbol: 'S_{\mathrm{E1}}'
    description: Exciter saturation factor at exciter output voltage E 1
    unit: null
    typical_values: [1.54]
  - name: E2
    symbol: 'E_{2}'
    description: Exciter output voltage for saturation factor S (E ) E 2
    unit: pu
    typical_values: [3.6]
  - name: SE2
    symbol: 'S_{\mathrm{E2}}'
    description: Exciter saturation factor at exciter output voltage E 2
    unit: null
    typical_values: [1.26]
  - name: KF
    symbol: 'K_{\mathrm{F}}'
    description: Rate feedback gain
    unit: pu
    typical_values: [0]
  - name: TF
    symbol: 'T_{\mathrm{F}}'
    description: Rate feedback time constant
    unit: s
    typical_values: [1]
  - name: KP
    symbol: 'K_{\mathrm{P}}'
    description: Potential circuit gain coefficient
    unit: pu
    typical_values: [1]
  - name: ThetaP
    symbol: '\theta_{\mathrm{P}}'
    description: Potential circuit phase angle (degrees)
    unit: pu
    typical_values: [0]
  - name: KI
    symbol: 'K_{\mathrm{I}}'
    description: Potential circuit (current) gain coefficient
    unit: pu
    typical_values: [0]
  - name: XL
    symbol: 'X_{\mathrm{L}}'
    description: Reactance associated with potential source
    unit: pu
    typical_values: [0]
  - name: KC1
    symbol: 'K_{\mathrm{C1}}'
    description: Rectifier loading factor proportional to commutating reactance
    unit: pu
    typical_values: [0]
  - name: VBmax
    symbol: 'V_{\mathrm{Bmax}}'
    description: Maximum available exciter field voltage
    unit: pu
    typical_values: [1.5]
  - name: SW1
    symbol: '\mathrm{SW}_{1}'
    description: Logical switch 1
    unit: null
    typical_values: [pos. A]
