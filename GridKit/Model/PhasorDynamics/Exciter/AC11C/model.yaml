name: AC11C
parameters:
  - name: RC
    symbol: 'R_{\mathrm{C}}'
    description: Resistive component of load compensation
    unit: pu
    typical_values: [0]
  - name: XC
    symbol: 'X_{\mathrm{C}}'
    description: Reactance component of load compensation
    unit: pu
    typical_values: [0]
  - name: TR
    symbol: 'T_{\mathrm{R}}'
    description: Regulator input filter time constant
    unit: s
    typical_values: [0.01]
  - name: KPA
    symbol: 'K_{\mathrm{PA}}'
    description: Voltage regulator proportional gain
    unit: pu
    typical_values: [30]
  - name: TIA
    symbol: 'T_{\mathrm{IA}}'
    description: Voltage regulator integral time constant
    unit: s
    typical_values: [2]
  - name: KPU
    symbol: 'K_{\mathrm{PU}}'
    description: UEL regulator proportional gain
    unit: pu
    typical_values: [30]
  - name: TIU
    symbol: 'T_{\mathrm{IU}}'
    description: UEL regulator integral time constant
    unit: s
    typical_values: [2]
  - name: KB
    symbol: 'K_{\mathrm{B}}'
    description: Voltage and UEL regulator derivative gain
    unit: pu
    typical_values: [3]
  - name: TB
    symbol: 'T_{\mathrm{B}}'
    description: Time constant for derivative element
    unit: s
    typical_values: [0.4]
  - name: KPO
    symbol: 'K_{\mathrm{PO}}'
    description: OEL regulator proportional gain
    unit: pu
    typical_values: [30]
  - name: TIO
    symbol: 'T_{\mathrm{IO}}'
    description: OEL regulator integral time constant
    unit: s
    typical_values: [2]
  - name: VRSmax
    symbol: 'V_{\mathrm{RSmax}}'
    description: Maximum PSS regulator output
    unit: pu
    typical_values: [3]
  - name: VRSmin
    symbol: 'V_{\mathrm{RSmin}}'
    description: Minimum PSS regulator output
    unit: pu
    typical_values: [-3]
  - name: VRmax
    symbol: 'V_{\mathrm{Rmax}}'
    description: Maximum regulator output
    unit: pu
    typical_values: [20]
  - name: VRmin
    symbol: 'V_{\mathrm{Rmin}}'
    description: Minimum regulator output
    unit: pu
    typical_values: [-20]
  - name: VAmax
    symbol: 'V_{\mathrm{Amax}}'
    description: Maximum exciter output
    unit: pu
    typical_values: [20]
  - name: VAmin
    symbol: 'V_{\mathrm{Amin}}'
    description: Minimum exciter output
    unit: pu
    typical_values: [0]
  - name: TE
    symbol: 'T_{\mathrm{E}}'
    description: Exciter field time constant
    unit: s
    typical_values: [0.4]
  - name: KC
    symbol: 'K_{\mathrm{C}}'
    description: Rectifier loading factor proportional to commutating reactance
    unit: pu
    typical_values: [0.173]
  - name: KD
    symbol: 'K_{\mathrm{D}}'
    description: Demagnetizing factor, function of exciter alternator reactances
    unit: pu
    typical_values: [1.0]
  - name: KE
    symbol: 'K_{\mathrm{E}}'
    description: Exciter field proportional constant
    unit: pu
    typical_values: [1.0]
  - name: VFEmax
    symbol: 'V_{\mathrm{FEmax}}'
    description: Maximum exciter field current
    unit: pu
    typical_values: [20]
  - name: E1
    symbol: 'E_{1}'
    description: Exciter output voltage for saturation factor S (E ) E 1
    unit: pu
    typical_values: [7.4]
  - name: Se1
    symbol: 'S_{\mathrm{E}}(E_{1})'
    description: Exciter saturation factor at exciter output voltage E 1
    unit: null
    typical_values: [0.214]
  - name: E2
    symbol: 'E_{2}'
    description: Exciter output voltage for saturation factor S (E ) E 2
    unit: pu
    typical_values: [5.55]
  - name: Se2
    symbol: 'S_{\mathrm{E}}(E_{2})'
    description: Exciter saturation factor at exciter output voltage E 2
    unit: null
    typical_values: [0.044]
  - name: SW1
    symbol: '\mathrm{SW}_{1}'
    description: Power source selector
    unit: null
    typical_values: [pos. B]
  - name: KP
    symbol: 'K_{\mathrm{P}}'
    description: Potential circuit (voltage) gain coefficient
    unit: pu
    typical_values: [1]
  - name: KI
    symbol: 'K_{\mathrm{I}}'
    description: Potential circuit (current) gain coefficient
    unit: pu
    typical_values: [0]
  - name: XL
    symbol: 'X_{\mathrm{L}}'
    description: Reactance associated with potential source
    unit: pu
    typical_values: [0]
  - name: ThetaP
    symbol: '\theta_{\mathrm{P}}'
    description: Potential circuit phase angle (degrees)
    unit: degrees
    typical_values: [0]
  - name: KC1
    symbol: 'K_{\mathrm{C1}}'
    description: Rectifier loading factor proportional to commutating reactance
    unit: pu
    typical_values: [0]
  - name: VB1max
    symbol: 'V_{\mathrm{B1max}}'
    description: Maximum available exciter voltage
    unit: pu
    typical_values: [1.5]
  - name: KI2
    symbol: 'K_{\mathrm{I2}}'
    description: Additive potential circuit (current) gain coefficient
    unit: pu
    typical_values: [0]
  - name: KC2
    symbol: 'K_{\mathrm{C2}}'
    description: Rectifier loading factor proportional to commutating reactance
    unit: pu
    typical_values: [0]
  - name: VB2max
    symbol: 'V_{\mathrm{B2max}}'
    description: Maximum available additive exciter voltage
    unit: pu
    typical_values: [0]
  - name: KBOOST
    symbol: 'K_{\mathrm{BOOST}}'
    description: Additive independent source
    unit: pu
    typical_values: [0]
  - name: VBOOST
    symbol: 'V_{\mathrm{BOOST}}'
    description: Reference value for applying additive (boost) circuit [see note 2]
    unit: pu
    typical_values: [0]
