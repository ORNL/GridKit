name: AC7C
parameters:
  - name: RC
    symbol: 'R_{\mathrm{C}}'
    description: Resistive component of load compensation
    unit: pu
    typical_values: [0]
  - name: XC
    symbol: 'X_{\mathrm{C}}'
    description: Reactance component of load compensation
    unit: pu
    typical_values: [0]
  - name: TR
    symbol: 'T_{\mathrm{R}}'
    description: Regulator input filter time constant
    unit: s
    typical_values: [0]
  - name: KPR
    symbol: 'K_{\mathrm{PR}}'
    description: Voltage regulator proportional gain
    unit: pu
    typical_values: [40, 170]
  - name: KIR
    symbol: 'K_{\mathrm{IR}}'
    description: Voltage regulator integral gain
    unit: pu/s
    typical_values: [5.6, 130]
  - name: KDR
    symbol: 'K_{\mathrm{DR}}'
    description: Voltage regulator derivative gain
    unit: pu.s
    typical_values: [0, 60]
  - name: TDR
    symbol: 'T_{\mathrm{DR}}'
    description: Lag time constant for derivative channel of PID controller
    unit: s
    typical_values: [1, 0.03]
  - name: VRmax
    symbol: 'V_{\mathrm{Rmax}}'
    description: Maximum regulator output
    unit: pu
    typical_values: [3.2, 10]
  - name: VRmin
    symbol: 'V_{\mathrm{Rmin}}'
    description: Minimum regulator output
    unit: pu
    typical_values: [-3.2, 0]
  - name: KPA
    symbol: 'K_{\mathrm{PA}}'
    description: Field current regulator proportional gain
    unit: pu
    typical_values: [112, 1]
  - name: KIA
    symbol: 'K_{\mathrm{IA}}'
    description: Field current regulator integral gain
    unit: pu/s
    typical_values: [0]
  - name: VAmax
    symbol: 'V_{\mathrm{Amax}}'
    description: Maximum field current regulator output
    unit: pu
    typical_values: [65.2, 10]
  - name: VAmin
    symbol: 'V_{\mathrm{Amin}}'
    description: Minimum field current regulator output
    unit: pu
    typical_values: [-54, 0]
  - name: KP
    symbol: 'K_{\mathrm{P}}'
    description: Potential circuit gain coefficient
    unit: pu
    typical_values: [1]
  - name: θP
    symbol: '\theta_{\mathrm{P}}'
    description: Potential circuit phase angle (degrees)
    unit: pu
    typical_values: [0]
  - name: KI
    symbol: 'K_{\mathrm{I}}'
    description: Potential circuit (current) gain coefficient
    unit: pu
    typical_values: [0]
  - name: XL
    symbol: 'X_{\mathrm{L}}'
    description: Reactance associated with potential source
    unit: pu
    typical_values: [0]
  - name: KC1
    symbol: 'K_{\mathrm{C1}}'
    description: Rectifier loading factor proportional to commutating reactance
    unit: pu
    typical_values: [0]
  - name: VBmax
    symbol: 'V_{\mathrm{Bmax}}'
    description: Maximum available exciter field voltage
    unit: pu
    typical_values: [999]
  - name: SW1
    symbol: '\mathrm{SW}_{1}'
    description: Power source selector
    unit: null
    typical_values: [pos. B, pos. A]
  - name: SW2
    symbol: '\mathrm{SW}_{2}'
    description: Power source selector
    unit: null
    typical_values: [pos. A]
  - name: KR
    symbol: 'K_{\mathrm{R}}'
    description: Gain related to regulator and alternator field power supply
    unit: pu
    typical_values: [0]
  - name: KL
    symbol: 'K_{\mathrm{L}}'
    description: Gain related to negative exciter field current capability
    unit: pu
    typical_values: [0]
  - name: KF1
    symbol: 'K_{\mathrm{F1}}'
    description: Generator field voltage feedback gain
    unit: pu
    typical_values: [0]
  - name: KF2
    symbol: 'K_{\mathrm{F2}}'
    description: Exciter field current feedback gain
    unit: pu
    typical_values: [0.08, 0]
  - name: KF3
    symbol: 'K_{\mathrm{F3}}'
    description: Rate feedback gain
    unit: pu
    typical_values: [0.01, 0]
  - name: TF
    symbol: 'T_{\mathrm{F}}'
    description: Rate feedback time constant
    unit: s
    typical_values: [1]
  - name: KC
    symbol: 'K_{\mathrm{C}}'
    description: Rectifier loading factor proportional to commutating reactance
    unit: pu
    typical_values: [0.12, 0]
  - name: KD
    symbol: 'K_{\mathrm{D}}'
    description: Demagnetizing factor, function of exciter alternator reactances
    unit: pu
    typical_values: [3.3, 0]
  - name: KE
    symbol: 'K_{\mathrm{E}}'
    description: Exciter field proportional constant
    unit: pu
    typical_values: [1]
  - name: TE
    symbol: 'T_{\mathrm{E}}'
    description: Exciter field time constant
    unit: s
    typical_values: [1.2, 1]
  - name: VFEmax
    symbol: 'V_{\mathrm{FEmax}}'
    description: Maximum exciter field current
    unit: pu
    typical_values: [23.2, 99]
  - name: VEmin
    symbol: 'V_{\mathrm{Emin}}'
    description: Minimum exciter voltage output
    unit: pu
    typical_values: [0]
  - name: E1
    symbol: 'E_{1}'
    description: Exciter output voltage for saturation factor S (E ) E 1
    unit: pu
    typical_values: [13.6, 4.5]
  - name: SE(E1)
    symbol: 'S_{\mathrm{E}}(E_{1})'
    description: Exciter saturation factor at exciter output voltage E 1
    unit: null
    typical_values: [3.74, 1.5]
  - name: E2
    symbol: 'E_{2}'
    description: Exciter output voltage for saturation factor S (E ) E 2
    unit: pu
    typical_values: [10.2, 3.38]
  - name: SE(E2)
    symbol: 'S_{\mathrm{E}}(E_{2})'
    description: Exciter saturation factor at exciter output voltage E 2
    unit: null
    typical_values: [0.32, 1.36]
