name: DC3A
parameters:
  - name: RC
    symbol: 'R_{\mathrm{C}}'
    description: Resistive component of load compensation
    unit: pu
    typical_values: [0]
  - name: XC
    symbol: 'X_{\mathrm{C}}'
    description: Reactance component of load compensation
    unit: pu
    typical_values: [0]
  - name: TR
    symbol: 'T_{\mathrm{R}}'
    description: Regulator input filter time constant
    unit: s
    typical_values: [0]
  - name: KE
    symbol: 'K_{\mathrm{E}}'
    description: Exciter field proportional constant
    unit: pu
    typical_values: [0.05, 1]
  - name: TE
    symbol: 'T_{\mathrm{E}}'
    description: Exciter field time constant
    unit: s
    typical_values: [0.5, 1.45]
  - name: KV
    symbol: 'K_{\mathrm{V}}'
    description: Fast raise/lower contact setting
    unit: pu
    typical_values: [0.05]
  - name: VRmax
    symbol: 'V_{\mathrm{Rmax}}'
    description: Maximum controller output
    unit: pu
    typical_values: [1, 5.7]
  - name: VRmin
    symbol: 'V_{\mathrm{Rmin}}'
    description: Minimum controller output
    unit: pu
    typical_values: [0, -1.1]
  - name: TRH
    symbol: 'T_{\mathrm{RH}}'
    description: Rheostat travel time
    unit: s
    typical_values: [20]
  - name: E1
    symbol: 'E_{1}'
    description: Exciter output voltage for saturation factor S (E ) E 1
    unit: pu
    typical_values: [3.375, 4.5]
  - name: SE1
    symbol: 'S_{\mathrm{E1}}'
    description: Exciter saturation factor at exciter output voltage E 1
    unit: null
    typical_values: [0.267, 0.27]
  - name: E2
    symbol: 'E_{2}'
    description: Exciter output voltage for saturation factor S (E ) E 2
    unit: pu
    typical_values: [3.15, 3.38]
  - name: SE2
    symbol: 'S_{\mathrm{E2}}'
    description: Exciter saturation factor at exciter output voltage E 2
    unit: null
    typical_values: [0.068, 0.07]
