name: AC9C
parameters:
  - name: RC
    symbol: 'R_{\mathrm{C}}'
    description: Resistive component of load compensation
    unit: pu
    typical_values: [0]
  - name: XC
    symbol: 'X_{\mathrm{C}}'
    description: Reactance component of load compensation
    unit: pu
    typical_values: [0]
  - name: TR
    symbol: 'T_{\mathrm{R}}'
    description: Regulator input filter time constant
    unit: s
    typical_values: [0.01]
  - name: KPR
    symbol: 'K_{\mathrm{PR}}'
    description: Voltage regulator proportional gain
    unit: pu
    typical_values: [10]
  - name: KIR
    symbol: 'K_{\mathrm{IR}}'
    description: Voltage regulator integral gain
    unit: pu/s
    typical_values: [10]
  - name: KDR
    symbol: 'K_{\mathrm{DR}}'
    description: Voltage regulator derivative gain
    unit: pu.s
    typical_values: [0]
  - name: TDR
    symbol: 'T_{\mathrm{DR}}'
    description: Lag time constant for derivative channel of PID controller
    unit: s
    typical_values: [0.01, 0.1]
  - name: VPIDmax
    symbol: 'V_{\mathrm{PIDmax}}'
    description: Maximum voltage regulator output
    unit: pu
    typical_values: [1.6]
  - name: VPIDmin
    symbol: 'V_{\mathrm{PIDmin}}'
    description: Minimum voltage regulator output
    unit: pu
    typical_values: [0]
  - name: KPA
    symbol: 'K_{\mathrm{PA}}'
    description: Field current regulator proportional gain
    unit: pu
    typical_values: [4]
  - name: KIA
    symbol: 'K_{\mathrm{IA}}'
    description: Field current regulator integral gain
    unit: pu/s
    typical_values: [0]
  - name: VAmax
    symbol: 'V_{\mathrm{Amax}}'
    description: Maximum current regulator output
    unit: pu
    typical_values: [0.996, 1]
  - name: VAmin
    symbol: 'V_{\mathrm{Amin}}'
    description: Minimum current regulator output
    unit: pu
    typical_values: [-0.866, -1]
  - name: KA
    symbol: 'K_{\mathrm{A}}'
    description: Controlled rectifier bridge equivalent gain
    unit: pu
    typical_values: [20]
  - name: TA
    symbol: 'T_{\mathrm{A}}'
    description: Controlled rectifier bridge equivalent time constant
    unit: s
    typical_values: [0.0018, 0.0017]
  - name: VRmax
    symbol: 'V_{\mathrm{Rmax}}'
    description: Maximum rectifier bridge output
    unit: pu
    typical_values: [19.92, 20]
  - name: VRmin
    symbol: 'V_{\mathrm{Rmin}}'
    description: Minimum rectifier bridge output
    unit: pu
    typical_values: [-17.32, -20]
  - name: KF
    symbol: 'K_{\mathrm{F}}'
    description: Exciter field current feedback gain
    unit: pu
    typical_values: [0.2]
  - name: TF
    symbol: 'T_{\mathrm{F}}'
    description: Field current feedback time constant
    unit: s
    typical_values: [0.01]
  - name: KFW
    symbol: 'K_{\mathrm{FW}}'
    description: Free wheel equivalent feedback gain
    unit: pu
    typical_values: [0, 0.4]
  - name: VFWmax
    symbol: 'V_{\mathrm{FWmax}}'
    description: Maximum free wheel feedback
    unit: pu
    typical_values: [10]
  - name: VFWmin
    symbol: 'V_{\mathrm{FWmin}}'
    description: Minimum free wheel feedback
    unit: pu
    typical_values: [0]
  - name: SCT
    symbol: 'S_{\mathrm{CT}}'
    description: Power stage type selector
    unit: null
    typical_values: [1, 0]
  - name: KC
    symbol: 'K_{\mathrm{C}}'
    description: Diode bridge loading factor proportional to commutating reactance
    unit: pu
    typical_values: [0]
  - name: KD
    symbol: 'K_{\mathrm{D}}'
    description: Demagnetizing factor, function of exciter alternator reactances
    unit: pu
    typical_values: [1]
  - name: KE
    symbol: 'K_{\mathrm{E}}'
    description: Exciter field proportional constant
    unit: pu
    typical_values: [1]
  - name: TE
    symbol: 'T_{\mathrm{E}}'
    description: Exciter field time constant
    unit: s
    typical_values: [1]
  - name: VFEmax
    symbol: 'V_{\mathrm{FEmax}}'
    description: Exciter field current limit
    unit: pu
    typical_values: [16]
  - name: VEmin
    symbol: 'V_{\mathrm{Emin}}'
    description: Minimum exciter output limit
    unit: pu
    typical_values: [0]
  - name: E1
    symbol: 'E_{1}'
    description: Exciter output voltage for saturation factor S (E ) E 1
    unit: pu
    typical_values: [4.167]
  - name: SE(E1)
    symbol: 'S_{\mathrm{E}}(E_{1})'
    description: Exciter saturation factor at exciter output voltage E 1
    unit: null
    typical_values: [0.001]
  - name: E2
    symbol: 'E_{2}'
    description: Exciter output voltage for saturation factor S (E ) E 2
    unit: pu
    typical_values: [3.125]
  - name: SE(E2)
    symbol: 'S_{\mathrm{E}}(E_{2})'
    description: Exciter saturation factor at exciter output voltage E 2
    unit: null
    typical_values: [0.01]
  - name: SW1
    symbol: '\mathrm{SW}_{1}'
    description: Power source selector
    unit: null
    typical_values: [pos. A]
  - name: KC1
    symbol: 'K_{\mathrm{C1}}'
    description: Rectifier loading factor proportional to commutating reactance
    unit: pu
    typical_values: [0]
  - name: KP
    symbol: 'K_{\mathrm{P}}'
    description: Potential circuit (voltage) gain coefficient
    unit: pu
    typical_values: [1]
  - name: KI1
    symbol: 'K_{\mathrm{I1}}'
    description: Compound circuit (current) gain coefficient
    unit: pu
    typical_values: [0]
  - name: XL
    symbol: 'X_{\mathrm{L}}'
    description: Reactance associated with potential source
    unit: pu
    typical_values: [0]
  - name: θP
    symbol: '\theta_{\mathrm{P}}'
    description: Potential circuit phase angle (degrees)
    unit: degrees
    typical_values: [0]
  - name: VB1max
    symbol: 'V_{\mathrm{B1max}}'
    description: Maximum available exciter voltage
    unit: pu
    typical_values: [100]
  - name: KC2
    symbol: 'K_{\mathrm{C2}}'
    description: Rectifier loading factor proportional to commutating reactance
    unit: pu
    typical_values: [0]
  - name: KI2
    symbol: 'K_{\mathrm{I2}}'
    description: Compound circuit (current) gain coefficient
    unit: pu
    typical_values: [0]
  - name: VB2max
    symbol: 'V_{\mathrm{B2max}}'
    description: Maximum available compound exciter voltage
    unit: pu
    typical_values: [0]
