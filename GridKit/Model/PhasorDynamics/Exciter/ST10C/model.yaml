name: ST10C
parameters:
  - name: RC
    symbol: 'R_{\mathrm{C}}'
    description: Resistive component of load compensation
    unit: pu
    typical_values: [0]
  - name: XC
    symbol: 'X_{\mathrm{C}}'
    description: Reactance component of load compensation
    unit: pu
    typical_values: [0]
  - name: TR
    symbol: 'T_{\mathrm{R}}'
    description: Regulator input filter time constant
    unit: s
    typical_values: [0.01]
  - name: KR
    symbol: 'K_{\mathrm{R}}'
    description: Regulator gain
    unit: pu
    typical_values: [500]
  - name: TB1
    symbol: 'T_{\mathrm{B1}}'
    description: Voltage regulator denominator (lag) time constant 1
    unit: s
    typical_values: [12.5]
  - name: TC1
    symbol: 'T_{\mathrm{C1}}'
    description: Voltage regulator numerator (lead) time constant 1
    unit: s
    typical_values: [1.5]
  - name: TB2
    symbol: 'T_{\mathrm{B2}}'
    description: Voltage regulator denominator (lag) time constant 2
    unit: s
    typical_values: [0.1]
  - name: TC2
    symbol: 'T_{\mathrm{C2}}'
    description: Voltage regulator numerator (lead) time constant 2
    unit: s
    typical_values: [0.1]
  - name: TUB1
    symbol: 'T_{\mathrm{UB1}}'
    description: UEL regulator denominator (lag) time constant 1
    unit: s
    typical_values: [12.5]
  - name: TUC1
    symbol: 'T_{\mathrm{UC1}}'
    description: UEL regulator numerator (lead) time constant 1
    unit: s
    typical_values: [1.5]
  - name: TUB2
    symbol: 'T_{\mathrm{UB2}}'
    description: UEL regulator denominator (lag) time constant 2
    unit: s
    typical_values: [0.1]
  - name: TUC2
    symbol: 'T_{\mathrm{UC2}}'
    description: UEL regulator numerator (lead) time constant 2
    unit: s
    typical_values: [0.1]
  - name: TOB1
    symbol: 'T_{\mathrm{OB1}}'
    description: OEL regulator denominator (lag) time constant 1
    unit: s
    typical_values: [12.5]
  - name: TOC1
    symbol: 'T_{\mathrm{OC1}}'
    description: OEL regulator numerator (lead) time constant 1
    unit: s
    typical_values: [1.5]
  - name: TOB2
    symbol: 'T_{\mathrm{OB2}}'
    description: OEL regulator denominator (lag) time constant 2
    unit: s
    typical_values: [0.1]
  - name: TOC2
    symbol: 'T_{\mathrm{OC2}}'
    description: OEL regulator numerator (lead) time constant 2
    unit: s
    typical_values: [0.1]
  - name: VRSmax
    symbol: 'V_{\mathrm{RSmax}}'
    description: Maximum PSS regulator output
    unit: pu
    typical_values: [5]
  - name: VRSmin
    symbol: 'V_{\mathrm{RSmin}}'
    description: Minimum PSS regulator output
    unit: pu
    typical_values: [-5]
  - name: VRmax
    symbol: 'V_{\mathrm{Rmax}}'
    description: Maximum regulator output
    unit: pu
    typical_values: [10]
  - name: VRmin
    symbol: 'V_{\mathrm{Rmin}}'
    description: Minimum regulator output
    unit: pu
    typical_values: [-8.7]
  - name: KC
    symbol: 'K_{\mathrm{C}}'
    description: Rectifier loading factor proportional to commutating reactance
    unit: pu
    typical_values: [0.01]
  - name: T1
    symbol: 'T_{1}'
    description: Equivalent time constant for rectifier bridge
    unit: s
    typical_values: [0.004]
  - name: SW1
    symbol: '\mathrm{SW}_{1}'
    description: Power source selector
    unit: null
    typical_values: [pos. A]
  - name: KP
    symbol: 'K_{\mathrm{P}}'
    description: Potential circuit (voltage) gain coefficient
    unit: pu
    typical_values: [1]
  - name: KI
    symbol: 'K_{\mathrm{I}}'
    description: Potential circuit (current) gain coefficient
    unit: pu
    typical_values: [0]
  - name: XL
    symbol: 'X_{\mathrm{L}}'
    description: Reactance associated with potential source
    unit: pu
    typical_values: [0]
  - name: θP
    symbol: '\theta_{\mathrm{P}}'
    description: Potential circuit phase angle (degrees)
    unit: degrees
    typical_values: [0]
  - name: VBmax
    symbol: 'V_{\mathrm{Bmax}}'
    description: Maximum available exciter voltage
    unit: pu
    typical_values: [1.5]
