name: OEL1B
parameters:
  - name: Itfpu
    symbol: 'I_{\mathrm{TFPU}}'
    description: OEL timed field current limiter pickup level
    unit: pu
    typical_values: [1.05]
  - name: Ifdmax
    symbol: 'I_{\mathrm{FDMAX}}'
    description: OEL instantaneous field current limit
    unit: pu
    typical_values: [1.5]
  - name: Ifdlim
    symbol: 'I_{\mathrm{FDLIM}}'
    description: OEL timed field current limit
    unit: pu
    typical_values: [1.05]
  - name: Hyst
    symbol: '\mathrm{HYST}'
    description: OEL pick up/drop out hysteresis
    unit: pu
    typical_values: [0.03]
  - name: Kcd
    symbol: 'K_{\mathrm{CD}}'
    description: OEL cool-down gain
    unit: pu
    typical_values: [1]
  - name: Kramp
    symbol: 'K_{\mathrm{RAMP}}'
    description: OEL output ramp rate
    unit: pu/s
    typical_values: [10]
  - name: Ifdrated
    symbol: 'I_{\mathrm{FDrated}}'
    description: Rated field current
    unit: pu
    typical_values: [2.5]
