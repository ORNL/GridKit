name: HYG3
parameters:
  - name: Trate
    symbol: T_{\mathrm{rate}}
    description: Turbine rating
    unit: MW
    typical_values: []
  - name: Pmax
    symbol: P_{\mathrm{max}}
    description: Maximum gate opening
    unit: pu of mwcap
    typical_values: []
  - name: Pmin
    symbol: P_{\mathrm{min}}
    description: Minimum gate opening
    unit: pu of mwcap
    typical_values: []
  - name: Cflag
    symbol: C_{\mathrm{flag}}
    description: Governor control flag, 1=PID, -1=Double Derivative
    unit: null
    typical_values: []
  - name: Rgate
    symbol: R_{\mathrm{gate}}
    description: Steady-state droop, pu for governor output feedback
    unit: null
    typical_values: []
  - name: Relec
    symbol: R_{\mathrm{elec}}
    description: Steady-state droop, pu, for electric power feedback
    unit: null
    typical_values: []
  - name: Td
    symbol: T_{\mathrm{d}}
    description: Input filter time constant
    unit: s
    typical_values: []
  - name: Tf
    symbol: T_{\mathrm{f}}
    description: Filter time constant
    unit: s
    typical_values: []
  - name: Tp
    symbol: T_{\mathrm{p}}
    description: Lead time constant
    unit: s
    typical_values: []
  - name: Velopen
    symbol: V_{\mathrm{elopen}}
    description: Maximum gate opening velocity
    unit: pu/s
    typical_values: []
  - name: Velclose
    symbol: V_{\mathrm{elclose}}
    description: Maximum gate closing velocity
    unit: pu/s
    typical_values: []
  - name: K1
    symbol: K_{1}
    description: Double derivative gain
    unit: pu
    typical_values: []
  - name: K2
    symbol: K_{2}
    description: Double derivative gain, pu, if Cflag = -1
    unit: null
    typical_values: []
  - name: Ki
    symbol: K_{\mathrm{i}}
    description: Integral gain
    unit: pu
    typical_values: []
  - name: Kg
    symbol: K_{\mathrm{g}}
    description: Gate servo gain
    unit: pu
    typical_values: []
  - name: Tt
    symbol: T_{\mathrm{t}}
    description: Power feedback time constant
    unit: s
    typical_values: []
  - name: db1
    symbol: d_{\mathrm{b1}}
    description: Intentional deadband width
    unit: Hz
    typical_values: []
  - name: Eps
    symbol: E_{\mathrm{ps}}
    description: Intentional db hysteresis
    unit: Hz
    typical_values: []
  - name: db2
    symbol: d_{\mathrm{b2}}
    description: Unintentional deadband
    unit: MW
    typical_values: []
  - name: Tw
    symbol: T_{\mathrm{w}}
    description: Water inertia time constant
    unit: s
    typical_values: []
  - name: At
    symbol: A_{\mathrm{t}}
    description: Turbine gain
    unit: pu
    typical_values: []
  - name: Dturb
    symbol: D_{\mathrm{turb}}
    description: Turbine damping coefficient
    unit: pu
    typical_values: []
  - name: Qnl
    symbol: Q_{\mathrm{nl}}
    description: No-load flow at nominal head
    unit: pu
    typical_values: []
  - name: H0
    symbol: H_{0}
    description: Turbine nominal head
    unit: pu
    typical_values: []
  - name: Gv1
    symbol: G_{\mathrm{v1}}
    description: Nonlinear gain point 1
    unit: pu gv
    typical_values: []
  - name: Pgv1
    symbol: P_{\mathrm{gv1}}
    description: Nonlinear gain point 1
    unit: pu power
    typical_values: []
  - name: Gv2
    symbol: G_{\mathrm{v2}}
    description: Nonlinear gain point 2
    unit: pu gv
    typical_values: []
  - name: Pgv2
    symbol: P_{\mathrm{gv2}}
    description: Nonlinear gain point 2
    unit: pu power
    typical_values: []
  - name: Gv3
    symbol: G_{\mathrm{v3}}
    description: Nonlinear gain point 3
    unit: pu gv
    typical_values: []
  - name: Pgv3
    symbol: P_{\mathrm{gv3}}
    description: Nonlinear gain point 3
    unit: pu power
    typical_values: []
  - name: Gv4
    symbol: G_{\mathrm{v4}}
    description: Nonlinear gain point 4
    unit: pu gv
    typical_values: []
  - name: Pgv4
    symbol: P_{\mathrm{gv4}}
    description: Nonlinear gain point 4
    unit: pu power
    typical_values: []
  - name: Gv5
    symbol: G_{\mathrm{v5}}
    description: Nonlinear gain point 5
    unit: pu gv
    typical_values: []
  - name: Pgv5
    symbol: P_{\mathrm{gv5}}
    description: Nonlinear gain point 5
    unit: pu power
    typical_values: []
  - name: Gv6
    symbol: G_{\mathrm{v6}}
    description: Nonlinear gain point 6
    unit: pu gv
    typical_values: []
  - name: Pgv6
    symbol: P_{\mathrm{gv6}}
    description: Nonlinear gain point 6
    unit: pu power
    typical_values: []
