    unit: MWs/MVA
    typical_values: []
  - name: hg
    symbol: H_{\mathrm{g}}
    description: Generator inertia
    unit: MWs/MVA
    typical_values: []
  - name: dshaft
    symbol: D_{\mathrm{shaft}}
